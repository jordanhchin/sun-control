[package]
name = "sun-control"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for managing Sunshine game streaming servers, locally or remotely"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["sunshine", "tui", "moonlight", "streaming", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
hex = "0.4.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "form"] }
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.8"
url = "2.5.8"
x509-parser = "0.18.1"

[dev-dependencies]
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
